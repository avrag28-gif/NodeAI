name: Deploy NodeAI to Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "ai-server/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugging Face CLI
        run: pip install -U huggingface_hub

      - name: Deploy Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          hf upload "$HF_SPACE_ID" ai-server/ . --repo-type=space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
