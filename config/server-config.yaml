server:
  host: "0.0.0.0"
  port: 8080
  auth:
    enabled: true
    token: "CHANGE_THIS_TO_YOUR_SECRET_TOKEN"
  ssl:
    enabled: false

llm:
  engine: "llama.cpp"
  model_path: "./models/"
  default_model: "qwen2.5-7b-instruct-q4_k_m.gguf"
  context_length: 4096
  gpu_layers: 99
  threads: 8

agent:
  name: "MyAI"
  version: "1.0.0"
  personality: "helpful, technical, direct"
  max_history: 50
