<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NodeAI</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b0d10;color:#eee;height:100vh}
.app{height:100vh;display:flex;flex-direction:column;max-width:1100px;margin:auto}
.top{padding:16px 20px;border-bottom:1px solid #252930;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:700;font-size:20px}
.controls{display:flex;align-items:center;gap:12px}
.status{font-size:12px;color:#8b949e}
.toggle{position:relative;width:44px;height:24px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#30353d;border-radius:24px;transition:.3s}
.slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked+.slider{background:#2457d6}
.toggle input:checked+.slider:before{transform:translateX(20px)}
.toggle-label{font-size:11px;color:#8b949e;user-select:none}
.chat{flex:1;overflow:auto;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:80%;padding:12px 15px;border-radius:14px;white-space:pre-wrap;line-height:1.5;font-size:14px}
.user{align-self:flex-end;background:#2457d6}
.ai{align-self:flex-start;background:#191d23}
.composer{padding:14px 20px;border-top:1px solid #252930;display:flex;gap:10px}
.composer input{flex:1;background:#15181d;border:1px solid #30353d;color:#fff;border-radius:12px;padding:13px}
.composer button{border:0;border-radius:12px;padding:0 20px;background:#fff;color:#111;font-weight:700}
.setup{position:fixed;inset:0;background:#0b0d10ee;display:grid;place-items:center}
.card{width:min(460px,92vw);background:#15181d;border:1px solid #30353d;border-radius:18px;padding:22px}
.card input{width:100%;margin:8px 0 12px;padding:12px;border-radius:10px;border:1px solid #30353d;background:#0d1014;color:#fff}
.card button{width:100%;padding:12px;border:0;border-radius:10px;font-weight:700}
.hidden{display:none}
.internet-on{color:#4ade80}.internet-off{color:#f87171}
</style></head>
<body><div class="app">
<div class="top">
  <div class="brand">NodeAI</div>
  <div class="controls">
    <label class="toggle"><input type="checkbox" id="netToggle" checked><span class="slider"></span></label>
    <span class="toggle-label" id="netLabel">Internet: ON</span>
    <div id="status" class="status">Connecting…</div>
  </div>
</div>
<div id="chat" class="chat"><div class="msg ai">NodeAI siap. Masukkan pesan.</div></div>
<form id="form" class="composer"><input id="input" autocomplete="off" placeholder="Ketik pesan…" required><button>Kirim</button></form>
</div>
<div id="setup" class="setup"><div class="card"><h2>NodeAI Web</h2><p>Masukkan token autentikasi NodeAI.</p><input id="token" type="password" placeholder="MYAI_AUTH_TOKEN"><button id="save">Masuk</button></div></div>
<script>
const tokenEl=document.getElementById('token'),setup=document.getElementById('setup'),chat=document.getElementById('chat'),input=document.getElementById('input'),statusEl=document.getElementById('status'),netToggle=document.getElementById('netToggle'),netLabel=document.getElementById('netLabel');
tokenEl.value=localStorage.getItem('nodeai_token')||'';
if(tokenEl.value) setup.classList.add('hidden');
let internetEnabled=localStorage.getItem('internet_enabled')!=='false';
netToggle.checked=internetEnabled;
updateNetLabel();
function updateNetLabel(){netLabel.textContent='Internet: '+(netToggle.checked?'ON':'OFF');netLabel.className='toggle-label '+(netToggle.checked?'internet-on':'internet-off');localStorage.setItem('internet_enabled',netToggle.checked)}
netToggle.onchange=()=>{updateNetLabel()};
function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
document.getElementById('save').onclick=()=>{localStorage.setItem('nodeai_token',tokenEl.value.trim());setup.classList.add('hidden');input.focus()};
async function health(){try{const r=await fetch('/api/status');const d=await r.json();statusEl.textContent=d.llm_connected?'Online':'Backend online · LLM belum siap'}catch(e){statusEl.textContent='Offline'}}
health();
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const msg=input.value.trim();if(!msg)return;input.value='';add(msg,'user');statusEl.textContent='Thinking…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('nodeai_token')},body:JSON.stringify({message:msg,internet_enabled:netToggle.checked})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Request gagal');add(d.response||'','ai');statusEl.textContent='Online'}catch(err){add('Error: '+err.message,'ai');statusEl.textContent='Error'}};
</script></body></html>
