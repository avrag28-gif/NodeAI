# MyAI Configuration

server:
  host: "0.0.0.0"
  port: 5000
  auth_token: "${MYAI_AUTH_TOKEN}"
  workspace: "C:\\NodeAi\\my-ai\\workspace"

llm:
  engine: "llama.cpp"
  host: "127.0.0.1"
  port: 8080
  model: "models\\Qwen2.5-Coder-7B-Instruct-Uncensored-Q4_K_M.gguf"
  context_length: 4096
  max_tokens: 2048
  temperature: 0.7
  gpu_layers: 0

agent:
  name: "MyAI"
  max_iterations: 20
  max_retries: 3
  step_timeout: 300
  context_compression_threshold: 20

memory:
  short_term_limit: 50
  long_term_enabled: true
  episodic_enabled: true

permissions:
  filesystem:
    read: "ALLOW"
    write: "ALLOW"
    delete: "ASK"
  terminal: "ASK"
  python: "ALLOW"
  internet: "ALLOW"
  camera: "ASK"
  microphone: "ASK"
  flashlight: "ALLOW"
  notifications: "ALLOW"
